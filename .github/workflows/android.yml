name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # যদি gradle-wrapper.jar মিসিং থাকে তবে এটি নিজে থেকেই ক্লাউডে Gradle 8.5 ইনস্টল করবে
      - name: Setup Gradle CLI Fallback
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Ensure Gradle Wrapper & Permissions
        run: |
          chmod +x gradlew || true
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "⚠️ gradle/wrapper/gradle-wrapper.jar was missing! Generating official wrapper automatically..."
            gradle wrapper --gradle-version 8.5 --distribution-type bin
            chmod +x gradlew
          fi
          ls -la gradle/wrapper/

      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ] && [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Verify APK Generated
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BinancePriceAlert-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
